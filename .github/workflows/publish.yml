name: Verify and publish ERP demo
on:
  push:
    branches: [main]
    paths-ignore:
      - DEMO-RAPOR.md
      - HANDOFF-*.md
      - demo-kanit/**
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: python scripts/test-sync.py
      - run: npm test -- --reporter=json --outputFile=unit-results.json
      - run: node scripts/data-metrics.mjs
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          EVIDENCE_DIR: playwright-evidence/local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-evidence
          path: |
            playwright-evidence/local
            unit-results.json
            demo-kanit/data-metrics.json
            test-results
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
  live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          LIVE_URL: https://veinpsycoo.github.io/kerim-erp-demo/
          EVIDENCE_DIR: playwright-evidence/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-evidence
          path: |
            playwright-evidence/live
            test-results
